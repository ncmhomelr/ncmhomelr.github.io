<!DOCTYPE html>
<html lang="es" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>NCM Home</title>
    <script>
        // Evitar parpadeo de tema al cargar (se ejecuta antes de que React monte)
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>

<body
    class="bg-gray-50 text-gray-800 dark:bg-gray-900 dark:text-gray-100 antialiased font-sans min-h-screen flex flex-col transition-colors duration-200 pb-16 sm:pb-0">
    <div id="root" class="flex flex-1 flex-col"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
